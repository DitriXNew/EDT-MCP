name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache Tycho P2 repositories
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository/.cache/tycho
            ~/.m2/repository/p2
          # Bump the vN generation by hand when 1C rotates the rolling 2026.1 repository: it is
          # republished in place for each service release and the previous plugin jars 404,
          # while the target file - which pins no versions - keeps hashing the same. The restore
          # prefix carries the same vN, or it would hand the stale entry back anyway (#570).
          key: ${{ runner.os }}-tycho-p2-v2-${{ hashFiles('**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-tycho-p2-v2-

      - name: Extract version from tag
        id: version
        run: |
          # tag: v1.26.0 → 1.26.0
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version from tag
        working-directory: mcp
        run: |
          mvn org.eclipse.tycho:tycho-versions-plugin:4.0.5:set-version \
            -DnewVersion=${{ steps.version.outputs.version }} \
            --batch-mode --no-transfer-progress

      - name: Maven build
        working-directory: mcp
        env:
          MAVEN_OPTS: -Xmx2g -XX:+UseParallelGC
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mvn-retry.sh" clean verify --batch-mode --no-transfer-progress -T 1C

      - name: Build proxy
        env:
          MAVEN_OPTS: -Xmx2g
        run: |
          mvn -f proxy/pom.xml clean verify --batch-mode --no-transfer-progress
          cp proxy/target/edt-mcp-proxy-*.jar "edt-mcp-proxy-v${{ steps.version.outputs.version }}.jar"

      - name: Package archive
        run: |
          cd mcp/repositories/com.ditrix.edt.mcp.server.repository/target/repository
          zip -r "$GITHUB_WORKSPACE/MCP-EDT.v${{ steps.version.outputs.version }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: MCP-EDT v${{ steps.version.outputs.version }}
          files: |
            MCP-EDT.v*.zip
            edt-mcp-proxy-v*.jar
          generate_release_notes: true
