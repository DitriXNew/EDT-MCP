name: Oldest platform (EDT 2026.1)

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: oldest-platform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Ending EDT 2026.1 support means removing this workflow together with the README claim.
jobs:
  linkage:
    name: EDT 2026.1 linkage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Eclipse 4.30's p2 director runs on 17; Tycho runs on 25 below.
      - name: Set up JDK 17 for the director
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install EDT 2026.1 without launching it
        id: edt
        uses: ./.github/actions/setup-edt
        env:
          EDT_PIN_REQUIRE_READABLE: "1"
        with:
          install-only: "true"
          eclipse-archive: "https://archive.eclipse.org/eclipse/downloads/drops4/R-4.30-202312010110/eclipse-platform-4.30-linux-gtk-x86_64.tar.gz"
          edt-p2: "https://edt.1c.ru/downloads/releases/ruby/2026.1/"
          eclipse-p2: "https://download.eclipse.org/releases/2023-12/"
          orbit-p2: "https://download.eclipse.org/tools/orbit/downloads/drops/R20211213173813/repository/"
          orbit-simrel-p2: "https://download.eclipse.org/tools/orbit/simrel/orbit-aggregation/release/4.37.0/"
          java-runtime: "17"
          # The separate GraphicalScheme feature belongs to the newer platform.
          bp-scheme-iu: ""

      - name: Set up JDK 25 for Tycho
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Set up Maven
        uses: ./.github/actions/setup-maven

      - name: Cache Tycho P2 repositories
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository/.cache/tycho
            ~/.m2/repository/p2
          key: ${{ runner.os }}-tycho-p2-edt261-${{ hashFiles('**/*.target') }}-${{ steps.edt.outputs.base-cache-key }}
          restore-keys: |
            ${{ runner.os }}-tycho-p2-edt261-

      - name: Verify EDT 2026.1 linkage
        env:
          EDT_INSTALL: ${{ steps.edt.outputs.install-dir }}
          MAVEN_OPTS: -Xmx2g -XX:+UseParallelGC
        run: |
          set +e
          bash source/verify-oldest-platform.sh "$EDT_INSTALL"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::EDT 2026.1 linkage check failed: the bundle references an API missing from EDT 2026.1, or platform resolution failed (see script output above)."
          fi
          exit "$status"
