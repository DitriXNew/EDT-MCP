name: Set up Maven
description: >
  Installs a pinned Maven and puts it first on PATH, so the build does not follow the runner image's
  Maven. Maven 3.10's resolver rejects the nested-jar classifiers (lib/x.jar) Tycho 5.0.4 gives the
  p2 dependencies it injects ("Invalid Collect Request: null -> [...]"); move only with a Tycho that
  accepts it.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        VERSION=3.9.16
        SHA512=831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
        ARCHIVE="$RUNNER_TEMP/apache-maven-$VERSION-bin.tar.gz"
        curl --fail --silent --show-error --location --retry 3 --output "$ARCHIVE" \
          "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$VERSION/apache-maven-$VERSION-bin.tar.gz"
        echo "$SHA512  $ARCHIVE" | sha512sum --check --strict
        tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/apache-maven-$VERSION/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/apache-maven-$VERSION/bin/mvn" --version
