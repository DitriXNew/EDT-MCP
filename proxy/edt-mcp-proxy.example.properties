# Set these environment variables in the account that runs the proxy.
# This example contains variable names only. Never commit real tokens.
port=8764
scan=8765-8774
refresh=20
timeout=300
bind=0.0.0.0
authTokenEnv=PROXY_CLIENT_TOKEN
backend.8765.tokenEnv=EDT_FIRST_TOKEN
backend.8766.tokenEnv=EDT_SECOND_TOKEN
